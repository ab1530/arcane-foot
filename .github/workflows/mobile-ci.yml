name: Mobile CI (Flutter)

on:
  push:
    branches: [main, develop]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-ci.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'mobile/**'

jobs:
  analyze-and-test:
    name: Analyze & Test Flutter
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        working-directory: ./mobile
        run: flutter pub get

      - name: Run code generation (build_runner)
        working-directory: ./mobile
        run: flutter pub run build_runner build --delete-conflicting-outputs || true

      - name: Verify formatting
        working-directory: ./mobile
        run: dart format --set-exit-if-changed .

      - name: Analyze code
        working-directory: ./mobile
        run: flutter analyze

      - name: Run unit tests
        working-directory: ./mobile
        run: flutter test --coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./mobile/coverage/lcov.info
          flags: flutter
          name: flutter-coverage

      - name: Build APK (Android)
        working-directory: ./mobile
        run: flutter build apk --debug --no-pub

      - name: Build iOS (no codesign)
        working-directory: ./mobile
        run: flutter build ios --debug --no-codesign --no-pub || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-apk-debug
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7

  build-web:
    name: Build Flutter Web
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        working-directory: ./mobile
        run: flutter pub get

      - name: Build web
        working-directory: ./mobile
        run: flutter build web --release --web-renderer canvaskit

      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: flutter-web-build
          path: mobile/build/web
          retention-days: 7

  build-ios:
    name: Build iOS
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        working-directory: ./mobile
        run: flutter pub get

      - name: Build iOS (no codesign)
        working-directory: ./mobile
        run: flutter build ios --debug --no-codesign

      - name: Run iOS unit tests
        working-directory: ./mobile
        run: flutter test
