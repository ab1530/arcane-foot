name: Smoke Tests

on:
  workflow_run:
    workflows: ["Deploy to Production"]
    types:
      - completed
  workflow_dispatch:

jobs:
  smoke-tests:
    name: Run Edge/Web Smoke Tests
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}

    steps:
      - name: Check required URLs
        env:
          EDGE_FUNCTIONS_BASE_URL: ${{ secrets.EDGE_FUNCTIONS_BASE_URL }}
          WEB_APP_URL: ${{ secrets.WEB_APP_URL }}
        run: |
          set -euo pipefail
          test -n "$EDGE_FUNCTIONS_BASE_URL" || (echo "Missing EDGE_FUNCTIONS_BASE_URL secret" && exit 1)
          test -n "$WEB_APP_URL" || (echo "Missing WEB_APP_URL secret" && exit 1)

      - name: Edge health check
        env:
          EDGE_FUNCTIONS_BASE_URL: ${{ secrets.EDGE_FUNCTIONS_BASE_URL }}
        run: |
          set -euo pipefail
          RESPONSE=$(curl -fsS "$EDGE_FUNCTIONS_BASE_URL/health")
          echo "$RESPONSE"
          echo "$RESPONSE" | jq -e '.status == "ok"' >/dev/null

      - name: Web availability check
        env:
          WEB_APP_URL: ${{ secrets.WEB_APP_URL }}
        run: |
          set -euo pipefail
          CODE=$(curl -s -o /dev/null -w "%{http_code}" "$WEB_APP_URL")
          if [ "$CODE" -lt 200 ] || [ "$CODE" -ge 400 ]; then
            echo "Web availability failed with status $CODE"
            exit 1
          fi

      - name: Optional public passport check
        if: ${{ secrets.SMOKE_PASSPORT_TOKEN != '' }}
        env:
          WEB_APP_URL: ${{ secrets.WEB_APP_URL }}
          SMOKE_PASSPORT_TOKEN: ${{ secrets.SMOKE_PASSPORT_TOKEN }}
        run: |
          set -euo pipefail
          curl -fsS "$WEB_APP_URL/passport/$SMOKE_PASSPORT_TOKEN" >/dev/null

      - name: Optional public shortlist check
        if: ${{ secrets.SMOKE_SHORTLIST_TOKEN != '' }}
        env:
          WEB_APP_URL: ${{ secrets.WEB_APP_URL }}
          SMOKE_SHORTLIST_TOKEN: ${{ secrets.SMOKE_SHORTLIST_TOKEN }}
        run: |
          set -euo pipefail
          curl -fsS "$WEB_APP_URL/shortlist/$SMOKE_SHORTLIST_TOKEN" >/dev/null
