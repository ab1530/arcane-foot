# 🚀 ARCANE Football - GitLab CI/CD Pipeline (Version Améliorée)
#
# Pipeline professionnel avec :
# - ✅ Build optimisé avec cache
# - ✅ Tests parallélisés
# - ✅ Security scanning
# - ✅ Code quality
# - ✅ Déploiements automatisés
# - ✅ Retry logic

---

stages:
  - 🔍 validate      # Validation rapide (lint, format)
  - 🏗️  build         # Build backend + web
  - 🧪 test          # Tests unitaires
  - 🔒 security      # Security scans
  - 🎭 qa            # Tests E2E et QA
  - 📦 package       # Docker images
  - 🚀 deploy        # Déploiements

# ============================================================================
# Variables Globales
# ============================================================================

variables:
  NODE_ENV: test
  NPM_CONFIG_FUND: "false"
  NPM_CONFIG_AUDIT: "false"
  PLAYWRIGHT_BROWSERS_PATH: /cache/ms-playwright
  SENTRY_VALIDATE: "true"

  # Docker
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: "/certs"

  # Performance
  GIT_DEPTH: 10  # Shallow clone for faster checkouts
  FF_USE_FASTZIP: "true"
  ARTIFACT_COMPRESSION_LEVEL: "fast"
  CACHE_COMPRESSION_LEVEL: "fast"

# ============================================================================
# Cache Strategy (Global)
# ============================================================================

.cache_template: &cache_template
  cache:
    key:
      files:
        - backend/package-lock.json
        - web/package-lock.json
    paths:
      - backend/node_modules
      - web/node_modules
      - .cache/
      - .npm/
    policy: pull

.cache_push_template: &cache_push_template
  cache:
    key:
      files:
        - backend/package-lock.json
        - web/package-lock.json
    paths:
      - backend/node_modules
      - web/node_modules
      - .cache/
      - .npm/
    policy: push

# ============================================================================
# Job Templates (DRY principle)
# ============================================================================

.node_job:
  image: node:20-bullseye
  before_script:
    - node --version
    - npm --version
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure

.docker_job:
  image: docker:24.0.6
  services:
    - docker:24.0.6-dind
  before_script:
    - docker info
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure

# ============================================================================
# STAGE 1: 🔍 VALIDATE (Fast feedback - fail fast)
# ============================================================================

lint_backend:
  stage: 🔍 validate
  extends: .node_job
  <<: *cache_template
  script:
    - cd backend
    - npm ci --prefer-offline --no-audit
    - npm run lint
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_BRANCH == "main"'
  allow_failure: false

lint_web:
  stage: 🔍 validate
  extends: .node_job
  <<: *cache_template
  script:
    - cd web
    - npm ci --prefer-offline --no-audit
    - npm run lint
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_BRANCH == "main"'
  allow_failure: false

check_format:
  stage: 🔍 validate
  extends: .node_job
  <<: *cache_template
  script:
    - cd backend
    - npm ci --prefer-offline --no-audit
    - npm run format:check || echo "⚠️ Formatting issues found (non-blocking)"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  allow_failure: true  # Non-blocking

# ============================================================================
# STAGE 2: 🏗️ BUILD (Parallel builds)
# ============================================================================

build_backend:
  stage: 🏗️ build
  extends: .node_job
  <<: *cache_push_template
  script:
    - cd backend
    - echo "📦 Installing dependencies..."
    - npm ci --prefer-offline --no-audit
    - echo "🏗️ Building backend..."
    - npm run build
    - echo "✅ Backend build complete"
    - ls -lh dist/
  artifacts:
    paths:
      - backend/dist/
      - backend/node_modules/
      - backend/package.json
      - backend/package-lock.json
    expire_in: 1 day
    reports:
      dotenv: backend/build.env
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_BRANCH == "main"'

build_web:
  stage: 🏗️ build
  extends: .node_job
  <<: *cache_push_template
  script:
    - cd web
    - echo "📦 Installing dependencies..."
    - npm ci --prefer-offline --no-audit
    - echo "🏗️ Building web..."
    - npm run build
    - echo "✅ Web build complete"
    - du -sh .next
  artifacts:
    paths:
      - web/.next/
      - web/node_modules/
      - web/package.json
      - web/package-lock.json
    expire_in: 1 day
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_BRANCH == "main"'

# ============================================================================
# STAGE 3: 🧪 TEST (Parallel test execution)
# ============================================================================

test_backend_unit:
  stage: 🧪 test
  extends: .node_job
  needs:
    - build_backend
  services:
    - name: postgres:16-alpine
      alias: postgres
  variables:
    DATABASE_URL: postgresql://postgres:postgres@postgres:5432/arcane_test?schema=public
    POSTGRES_PASSWORD: postgres
    POSTGRES_USER: postgres
    POSTGRES_DB: arcane_test
    JWT_SECRET: test-secret-key-ci
    SUPABASE_URL: http://localhost:9999
    SUPABASE_SERVICE_KEY: test-key
  script:
    - cd backend
    - echo "🗄️ Setting up database..."
    - apt-get update -qq && apt-get install -y postgresql-client
    - npx prisma generate
    - npx prisma migrate deploy
    - echo "🧪 Running unit tests..."
    - npm run test:ci
    - echo "📊 Test coverage: $(grep -oP '(?<=Lines\s+:\s)[0-9.]+' coverage/coverage-summary.json || echo 'N/A')%"
  coverage: '/Lines\s+:\s+([0-9.]+)%/'
  artifacts:
    when: always
    paths:
      - backend/coverage/
      - backend/test-results/
    reports:
      junit: backend/test-results/junit.xml
      coverage_report:
        coverage_format: cobertura
        path: backend/coverage/cobertura-coverage.xml
    expire_in: 1 week
  retry:
    max: 2
    when:
      - script_failure

test_backend_e2e:
  stage: 🧪 test
  extends: .node_job
  needs:
    - build_backend
  services:
    - name: postgres:16-alpine
      alias: postgres
  variables:
    DATABASE_URL: postgresql://postgres:postgres@postgres:5432/arcane_test?schema=public
    POSTGRES_PASSWORD: postgres
    JWT_SECRET: test-secret-key-ci
  script:
    - cd backend
    - apt-get update -qq && apt-get install -y postgresql-client
    - npx prisma generate
    - npx prisma migrate deploy
    - echo "🧪 Running E2E tests..."
    - npm run test:e2e || echo "⚠️ Some E2E tests failed (non-blocking for now)"
  artifacts:
    when: always
    paths:
      - backend/test-results/
    expire_in: 1 week
  allow_failure: true  # Non-blocking for now
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_BRANCH == "main"'

test_web_unit:
  stage: 🧪 test
  extends: .node_job
  needs:
    - build_web
  script:
    - cd web
    - echo "🧪 Running web tests..."
    - npm run test:ci
  artifacts:
    when: always
    paths:
      - web/coverage/
    reports:
      junit: web/test-results/junit.xml
    expire_in: 1 week
  allow_failure: true  # Non-blocking

# ============================================================================
# STAGE 4: 🔒 SECURITY (Parallel security scans)
# ============================================================================

security_scan_npm:
  stage: 🔒 security
  extends: .node_job
  needs:
    - build_backend
  script:
    - cd backend
    - echo "🔒 Running npm audit..."
    - npm audit --audit-level=high || echo "⚠️ Security vulnerabilities found"
  artifacts:
    when: always
    paths:
      - backend/npm-audit.json
    expire_in: 1 week
  allow_failure: true  # Non-blocking
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_BRANCH == "main"'

security_scan_sast:
  stage: 🔒 security
  image: returntocorp/semgrep
  script:
    - semgrep --config=auto backend/ --json --output=semgrep-report.json || true
    - echo "🔒 SAST scan complete"
  artifacts:
    when: always
    paths:
      - semgrep-report.json
    reports:
      sast: semgrep-report.json
    expire_in: 1 week
  allow_failure: true
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

# ============================================================================
# STAGE 5: 🎭 QA (E2E with Playwright)
# ============================================================================

qa_playwright:
  stage: 🎭 qa
  extends: .node_job
  needs:
    - build_backend
    - build_web
    - test_backend_unit
    - test_web_unit
  services:
    - name: postgres:16-alpine
      alias: postgres
  variables:
    DATABASE_URL: postgresql://postgres:postgres@postgres:5432/arcane_test?schema=public
  script:
    - echo "🎭 Setting up QA environment..."
    - apt-get update -qq && apt-get install -y postgresql-client

    - echo "🗄️ Running migrations..."
    - cd backend
    - npx prisma generate
    - npx prisma migrate deploy
    - cd ..

    - echo "🌐 Installing Playwright..."
    - cd web
    - npx playwright install --with-deps chromium

    - echo "🧪 Running E2E tests..."
    - npm run test:e2e || echo "⚠️ Some E2E tests failed"

    - echo "📊 Generating QA report..."
    - cd ..
    - mkdir -p tests/output
    - echo "# QA Report - $(date)" > tests/output/qa_report.md
    - echo "Pipeline: $CI_PIPELINE_ID" >> tests/output/qa_report.md
    - echo "Commit: $CI_COMMIT_SHORT_SHA" >> tests/output/qa_report.md
  artifacts:
    when: always
    paths:
      - web/playwright-report/
      - web/test-results/
      - tests/output/qa_report.md
    expire_in: 1 week
  allow_failure: true
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
      when: on_success
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: on_success

# ============================================================================
# STAGE 6: 📦 PACKAGE (Docker images)
# ============================================================================

build_docker_images:
  stage: 📦 package
  extends: .docker_job
  needs:
    - build_backend
    - build_web
  script:
    - echo "🐳 Building Docker images..."

    # Backend
    - echo "📦 Building backend image..."
    - docker build
        -f Dockerfile.backend
        -t "$CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHA"
        -t "$CI_REGISTRY_IMAGE/backend:$CI_COMMIT_REF_SLUG"
        --label "commit=$CI_COMMIT_SHA"
        --label "branch=$CI_COMMIT_BRANCH"
        --label "pipeline=$CI_PIPELINE_ID"
        --label "build-date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
        .

    # Web
    - echo "📦 Building web image..."
    - docker build
        -f Dockerfile.web
        -t "$CI_REGISTRY_IMAGE/web:$CI_COMMIT_SHA"
        -t "$CI_REGISTRY_IMAGE/web:$CI_COMMIT_REF_SLUG"
        --label "commit=$CI_COMMIT_SHA"
        --label "branch=$CI_COMMIT_BRANCH"
        .

    # Push images
    - echo "⬆️ Pushing images to registry..."
    - docker push "$CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHA"
    - docker push "$CI_REGISTRY_IMAGE/backend:$CI_COMMIT_REF_SLUG"
    - docker push "$CI_REGISTRY_IMAGE/web:$CI_COMMIT_SHA"
    - docker push "$CI_REGISTRY_IMAGE/web:$CI_COMMIT_REF_SLUG"

    - echo "✅ Docker images pushed successfully"
    - echo "Backend: $CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHA"
    - echo "Web: $CI_REGISTRY_IMAGE/web:$CI_COMMIT_SHA"
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

# ============================================================================
# STAGE 7: 🚀 DEPLOY
# ============================================================================

deploy_staging:
  stage: 🚀 deploy
  extends: .docker_job
  needs:
    - build_docker_images
  environment:
    name: staging
    url: https://staging.arcane-football.com
    on_stop: stop_staging
  script:
    - echo "🚀 Deploying to STAGING..."
    - chmod +x scripts/deploy/deploy-staging.sh
    - ./scripts/deploy/deploy-staging.sh
    - echo "✅ Staging deployment complete"
    - echo "🔗 URL: https://staging.arcane-football.com"
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
      when: manual
      allow_failure: false
  retry:
    max: 2
    when:
      - script_failure

stop_staging:
  stage: 🚀 deploy
  extends: .docker_job
  environment:
    name: staging
    action: stop
  script:
    - echo "🛑 Stopping staging environment..."
    - echo "Add your stop logic here (e.g., scale down k8s, stop containers)"
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
      when: manual

deploy_production:
  stage: 🚀 deploy
  extends: .docker_job
  needs:
    - build_docker_images
    - qa_playwright
  environment:
    name: production
    url: https://arcane-football.com
  script:
    - echo "🚀 Deploying to PRODUCTION..."
    - echo "⚠️ This will deploy to LIVE production"
    - chmod +x scripts/deploy/deploy-production.sh
    - ./scripts/deploy/deploy-production.sh
    - echo "✅ Production deployment complete"
    - echo "🔗 URL: https://arcane-football.com"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
      allow_failure: false
  retry:
    max: 1
    when: never  # Never auto-retry production deployments

# ============================================================================
# NOTIFICATIONS & CLEANUP
# ============================================================================

notify_success:
  stage: .post
  image: curlimages/curl:latest
  script:
    - |
      if [ -n "$SLACK_WEBHOOK_URL" ]; then
        curl -X POST "$SLACK_WEBHOOK_URL" \
          -H 'Content-Type: application/json' \
          -d "{
            \"text\": \"✅ Pipeline #$CI_PIPELINE_ID succeeded\",
            \"blocks\": [{
              \"type\": \"section\",
              \"text\": {
                \"type\": \"mrkdwn\",
                \"text\": \"*Pipeline Succeeded* ✅\n\n*Branch:* $CI_COMMIT_BRANCH\n*Commit:* \`$CI_COMMIT_SHORT_SHA\`\n*Author:* $GITLAB_USER_NAME\n\n<$CI_PIPELINE_URL|View Pipeline>\"
              }
            }]
          }"
      fi
  when: on_success
  allow_failure: true

notify_failure:
  stage: .post
  image: curlimages/curl:latest
  script:
    - |
      if [ -n "$SLACK_WEBHOOK_URL" ]; then
        curl -X POST "$SLACK_WEBHOOK_URL" \
          -H 'Content-Type: application/json' \
          -d "{
            \"text\": \"❌ Pipeline #$CI_PIPELINE_ID failed\",
            \"blocks\": [{
              \"type\": \"section\",
              \"text\": {
                \"type\": \"mrkdwn\",
                \"text\": \"*Pipeline Failed* ❌\n\n*Branch:* $CI_COMMIT_BRANCH\n*Commit:* \`$CI_COMMIT_SHORT_SHA\`\n*Author:* $GITLAB_USER_NAME\n\n<$CI_PIPELINE_URL|View Pipeline>\"
              }
            }]
          }"
      fi
  when: on_failure
  allow_failure: true

# ============================================================================
# WORKFLOW RULES (Control when pipelines run)
# ============================================================================

workflow:
  rules:
    # Run for merge requests
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    # Run for main and develop branches
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "develop"'
    # Run for tags (releases)
    - if: '$CI_COMMIT_TAG'
    # Don't run for other branches to save CI minutes
    - when: never
