# Kubernetes Runner Configuration for GitLab CI/CD
# This file documents the resource limits to apply when migrating to K8s runners
#
# To use this configuration:
# 1. Install GitLab Runner on your Kubernetes cluster
# 2. Configure runner with these resource limits
# 3. Uncomment the K8s-specific sections in .gitlab-ci.yml

# Resource limits for different job types
qa_job_resources:
  requests:
    memory: "4Gi"
    cpu: "2000m"
  limits:
    memory: "6Gi"
    cpu: "3000m"

build_job_resources:
  requests:
    memory: "2Gi"
    cpu: "1000m"
  limits:
    memory: "4Gi"
    cpu: "2000m"

test_job_resources:
  requests:
    memory: "2Gi"
    cpu: "1000m"
  limits:
    memory: "3Gi"
    cpu: "1500m"

# PostgreSQL service for QA
postgres_service_resources:
  requests:
    memory: "512Mi"
    cpu: "500m"
  limits:
    memory: "1Gi"
    cpu: "1000m"

