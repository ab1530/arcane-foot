# Migration checklist:
# ☐ Install GitLab Runner on K8s cluster
# ☐ Configure runner with resource limits above
# ☐ Set up S3 or compatible cache storage
# ☐ Tag runner with "kubernetes" in GitLab
# ☐ Uncomment K8s sections in .gitlab-ci.yml
# ☐ Test pipeline with K8s runner
# ☐ Monitor resource usage and adjust limits
# ☐ Remove local runner registration
